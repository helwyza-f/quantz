[project]
name = "quantz"
version = "0.1.0"
description = "Autonomous market-monitoring and trade-execution agent foundation."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
quantz = "quantz.cli:main"

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
